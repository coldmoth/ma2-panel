<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17191b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Свет · MA2</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="concert.css">
  <script src="command-feedback.js" defer></script>
  <script src="interface.js" defer></script>
  <script src="app.js" defer></script>
  <script src="show-files.js" defer></script>
  <script src="light.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="move.js" defer></script>
  <script src="patch.js" defer></script>
</head>
<body class="panel">
  <nav id="rail" class="rail" aria-label="Разделы">
    <button type="button" data-sec="scenes"><span class="nav-icon" aria-hidden="true">▤</span>Сцены</button>
    <button type="button" data-sec="light"><span class="nav-icon" aria-hidden="true">☼</span>Свет</button>
    <button type="button" data-sec="prepare"><span id="rail-dot" class="badge dot"></span><span class="nav-icon" aria-hidden="true">⌑</span>Подготовка</button>
    <button type="button" data-sec="help"><span class="nav-icon" aria-hidden="true">?</span>Помощь</button>
  </nav>
  <div id="col" class="col">
    <header class="top">
      <div class="show"><small>Текущее шоу</small><b id="top-show">—</b></div>
      <span class="link"><span id="top-dot" class="dot"></span><span id="top-link" class="lt" aria-live="polite">Нет связи с мостом</span></span>
      <span id="mock" class="mock" hidden>Имитация</span>
      <span id="mode" class="mode" hidden>Подготовка</span>
      <span class="spacer"></span>
      <span id="selpill" class="selpill" hidden><span id="selpill-text"></span><button id="selpill-clear" type="button" aria-label="Снять выбор"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
      <button id="halt" type="button" class="btn stop" disabled></button>
      <button id="blackout" type="button" class="btn blackout" disabled></button>
    </header>
    <p id="operation-status" class="operation-status" role="status" aria-live="polite" hidden></p>
    <div id="banners"></div>
    <main id="page" class="page"></main>
    <div id="errors" class="error-messages" role="region" aria-label="Ошибки операций" aria-live="polite" hidden></div>
    <p id="notice" class="notice" role="alert" hidden></p>
  </div>
  <dialog id="dlg"></dialog>
  <noscript>Для управления светом включите JavaScript в настройках браузера.</noscript>
</body>
</html>
