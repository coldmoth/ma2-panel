<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1012">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Свет · MA2</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="show-files.js" defer></script>
  <script src="light.js" defer></script>
  <script src="plan.js" defer></script>
  <script src="move.js" defer></script>
  <script src="patch.js" defer></script>
</head>
<body class="panel">
  <nav id="rail" class="rail" aria-label="Разделы">
    <span class="rail-group">Концерт</span>
    <button type="button" data-sec="scenes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>Сцены</button>
    <button type="button" data-sec="light"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>Свет</button>
    <button type="button" data-sec="history"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg>История</button>
    <span class="grow"></span>
    <span class="rail-group setup">Подготовка</span>
    <button type="button" data-sec="start" class="r-setup"><span id="rail-dot" class="badge dot"></span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg>Площадка</button>
    <button type="button" data-sec="hall" class="r-setup"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V6l9-3 9 3v14zM8 20v-6h8v6"/></svg>Зал</button>
    <button type="button" data-sec="patch" class="r-setup"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M14 10v4M10 16v4"/></svg>Патч</button>
    <button type="button" data-sec="shows" class="r-setup"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l5 5v13H6zM14 3v5h5"/></svg>Шоу</button>
  </nav>
  <div id="col" class="col">
    <header class="top">
      <div class="show"><small>Шоу на пульте</small><b id="top-show">—</b></div>
      <span class="link"><span id="top-dot" class="dot"></span><span id="top-link" class="lt" aria-live="polite">Нет связи с мостом</span></span>
      <span id="mock" class="mock" hidden>Имитация</span>
      <span id="mode" class="mode" hidden>Подготовка</span>
      <span class="spacer"></span>
      <span id="selpill" class="selpill" hidden><span id="selpill-text"></span><button id="selpill-clear" type="button" aria-label="Снять выбор"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
      <button id="halt" type="button" class="btn stop" disabled></button>
      <button id="blackout" type="button" class="btn blackout" disabled></button>
    </header>
    <div id="banners"></div>
    <main id="page" class="page"></main>
    <div id="errors" class="error-messages" role="region" aria-label="Ошибки операций" aria-live="polite" hidden></div>
    <p id="notice" class="notice" role="alert" hidden></p>
  </div>
  <dialog id="dlg"></dialog>
  <noscript>Для управления светом включите JavaScript в настройках браузера.</noscript>
</body>
</html>
