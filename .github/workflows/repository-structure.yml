name: Repository structure Windows acceptance

on:
  push:
    branches: [refactor/repository-structure]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows-mock:
    name: Windows delivered ZIP, runtime, BAT, rollback and mock
    # Validate the delivered embedded runtime even if a separate venv diagnostic fails.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build delivered Windows x64 and USB bundles
        run: uv run --no-sync python -m scripts.build_windows --verify-reproducible
      - name: Delivered embedded Python, BAT and update rollback
        run: uv run --no-sync python scripts/windows_delivered.py
      - name: HTTP and WebSocket from delivered runtime (mock only)
        timeout-minutes: 2
        run: uv run --no-sync python scripts/ci_smoke.py --bundle dist/ma2-panel-win/ma2-panel/program --log test-results/windows-mock.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-candidate
          path: |
            dist/build-inputs.json
            dist/ma2-panel-win.zip
            dist/ma2-panel-win.zip.sha256
            dist/ma2-panel-update-usb.zip
            dist/ma2-panel-update-usb.zip.sha256
            dist/update/ma2-panel-update.zip
            dist/update/ma2-panel-update.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-mock-log
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

