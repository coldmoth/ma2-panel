name: Settings restart Windows acceptance
on:
  push:
    branches: [codex/fix-settings-restart]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: npm ci --prefix scripts/browser_smoke
      - run: npx --prefix scripts/browser_smoke playwright install chromium
      - run: uv run pytest tests/test_settings_restart.py -q -p no:cacheprovider
      - run: node tests/settings-restart.cjs
      - run: uv run python -m scripts.build_windows
      - run: uv run python scripts/settings_restart_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: settings-restart-windows
          path: test-results/settings-restart
          if-no-files-found: warn
