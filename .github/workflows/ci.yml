name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: 'Optional NEW test tag for a draft prerelease (empty = tests only)'
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  # A routine push must not cancel a manually requested delivery validation.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: uv sync --locked
      - name: Import runtime dependencies
        run: uv run --no-sync python -c "import bridge, fastapi, uvicorn, websockets, segno, pydantic_core"
      - name: pytest
        run: perl -e 'alarm 300; exec @ARGV' uv run --no-sync pytest -q -p no:cacheprovider --junitxml=test-results/pytest.xml
      - name: Panel DOM tests
        if: ${{ !cancelled() }}
        run: node tests/panel-v4.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: pytest-results
          path: test-results/pytest.xml
          retention-days: 7
          if-no-files-found: ignore

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_tag != ''
    needs: [tests, windows-tests, windows-mock, browser-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: draft-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRAFT_TAG: ${{ inputs.draft_tag }}
    steps:
      - name: Validate test tag
        run: |
          [[ "$DRAFT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|test)\.[a-zA-Z0-9.-]+$ ]] || exit 1
          if gh api "repos/$GH_REPO/git/ref/tags/$DRAFT_TAG" >/dev/null 2>&1; then
            echo 'Refusing to reuse an existing tag'; exit 1
          fi
      - name: Download tested Windows assets
        run: gh run download "$GITHUB_RUN_ID" --name windows-release-candidate --dir release-assets
      - name: Prepare draft only
        run: |
          while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check "$(basename "$checksum")")
          done < <(find release-assets -name '*.sha256' -type f -print0)
          mapfile -d '' assets < <(find release-assets -type f -print0)
          printf 'TEST BUILD. Hardware acceptance grandMA2 is incomplete.\nCommit: %s\nWindows x64, embedded Python 3.12.10. Update requires matching runtime lock.\nCI: https://github.com/%s/actions/runs/%s\nSHA256 files accompany each ZIP. HTTPS/GitHub ownership is the trust boundary; SHA256 is integrity, not an independent signature.\n' "$GITHUB_SHA" "$GH_REPO" "$GITHUB_RUN_ID" > release-notes.txt
          gh release create "$DRAFT_TAG" "${assets[@]}" --target "$GITHUB_SHA" --draft --prerelease --title "Test $DRAFT_TAG" --notes-file release-notes.txt

  windows-tests:
    name: Windows diagnostic (${{ matrix.group }})
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [release, update, browser-unit, browser-worker, selfcheck, rdm, watchdog]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bootstrap checkpoint
        timeout-minutes: 1
        shell: pwsh
        env:
          CI_GROUP: ${{ matrix.group }}
        run: |
          New-Item -ItemType Directory -Force test-results/checkpoints | Out-Null
          "bootstrap group=$env:CI_GROUP sha=$env:GITHUB_SHA utc=$([DateTime]::UtcNow.ToString('o')) image=$env:ImageOS/$env:ImageVersion" | Tee-Object test-results/checkpoints/bootstrap.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        with:
          name: win-bootstrap-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/checkpoints/bootstrap.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --locked
        timeout-minutes: 2
      - name: Python and pytest checkpoint
        timeout-minutes: 1
        run: .venv\Scripts\python.exe -c "import sys,pytest; print(sys.version); print(sys.executable); print(pytest.__version__)" > test-results/checkpoints/python.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        with:
          name: win-environment-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/checkpoints/python.txt
          retention-days: 7
          if-no-files-found: error
      - name: Collect and verify all Windows test IDs
        timeout-minutes: 2
        run: .venv\Scripts\python.exe -u scripts/ci_windows_isolation.py --group ${{ matrix.group }} --collect-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        with:
          name: win-plan-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/windows/${{ matrix.group }}/plan.json
          retention-days: 7
          if-no-files-found: error
      - name: Before pytest checkpoint
        timeout-minutes: 1
        run: '"before-pytest utc=$([DateTime]::UtcNow.ToString(''o''))" | Tee-Object test-results/checkpoints/before.txt'
      - name: Bounded pytest group
        timeout-minutes: 4
        # Direct interpreter keeps the supervisor outside pytest and uv trees.
        run: .venv\Scripts\python.exe -u scripts/ci_windows_isolation.py --group ${{ matrix.group }}
      - name: After pytest checkpoint
        if: always()
        timeout-minutes: 1
        run: '"after-pytest utc=$([DateTime]::UtcNow.ToString(''o'')) status=${{ job.status }}" | Tee-Object test-results/checkpoints/after.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 1
        with:
          name: win-result-${{ matrix.group }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: test-results/
          retention-days: 7
          if-no-files-found: error

  windows-mock:
    name: Windows delivered ZIP, runtime, BAT, rollback and mock
    # Validate the delivered embedded runtime even if a separate venv diagnostic fails.
    needs: [tests]
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build delivered Windows x64 and USB bundles
        run: uv run --no-sync python scripts/build_windows.py --verify-reproducible
      - name: Delivered embedded Python, BAT and update rollback
        run: uv run --no-sync python scripts/windows_delivered.py
      - name: HTTP and WebSocket from delivered runtime (mock only)
        timeout-minutes: 2
        run: uv run --no-sync python scripts/ci_smoke.py --bundle dist/ma2-panel-win/ma2-panel/program --log test-results/windows-mock.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-candidate
          path: |
            dist/build-inputs.json
            dist/ma2-panel-win.zip
            dist/ma2-panel-win.zip.sha256
            dist/ma2-panel-update-usb.zip
            dist/ma2-panel-update-usb.zip.sha256
            dist/update/ma2-panel-update.zip
            dist/update/ma2-panel-update.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-mock-log
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser-preflight:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: uv sync --locked
      - run: npm ci --prefix scripts/browser_smoke --ignore-scripts
      - run: node scripts/browser_smoke/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Chromium and WebKit, isolated mock
        timeout-minutes: 4
        run: uv run --no-sync python scripts/browser_smoke.py --output test-results/browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-preflight
          path: test-results/browser/
          retention-days: 7
          if-no-files-found: ignore
