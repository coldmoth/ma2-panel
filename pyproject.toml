[project]
name = "ma2-panel"
version = "3.2.0"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "segno>=1.6.6,<2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --tb=short"

# Application release; project/lock metadata identifies the compatible embedded runtime.
[tool.ma2panel]
release-version = "3.3.1"
